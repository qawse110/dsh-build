name: build-release
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DSH_KEYSTORE_B64: ${{ secrets.DSH_KEYSTORE_B64 }}
      DSH_KEYSTORE_PASS: ${{ secrets.DSH_KEYSTORE_PASS }}
      DSH_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          sdk-packages: platform-tools,platforms;android-36,build-tools;36.0.0
      - name: Decode keystore
        run: |
          echo "$DSH_KEYSTORE_B64" | base64 -d > "$DSH_KEYSTORE_FILE"
          ls -la "$DSH_KEYSTORE_FILE"
      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-release-apk
          path: app/build/outputs/apk/release/*.apk
